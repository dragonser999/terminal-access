<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Web Terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #terminal {
      flex: 1;
      width: 100%;
      height: calc(100% - 90px);
    }
    /* Mobile Toolbar */
    #mobile-toolbar {
      height: 90px;
      background: #121212;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      border-top: 1px solid #333;
      padding: 4px;
    }
    .row {
      display: flex;
      justify-content: space-around;
      width: 100%;
    }
    .btn {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
      user-select: none;
      min-width: 45px;
      text-align: center;
    }
    .btn:active {
      background: #555;
    }
  </style>
</head>
<body>

  <div id="terminal"></div>

  <!-- Mobile Extra Controls -->
  <div id="mobile-toolbar">
    <!-- Row 1: Action Keys -->
    <div class="row">
      <button class="btn" onclick="sendKey('\x03')">Ctrl+C</button>
      <button class="btn" onclick="sendKey('\x0f')">Ctrl+O</button>
      <button class="btn" onclick="sendKey('\x18')">Ctrl+X</button>
      <button class="btn" onclick="sendKey('\x1b')">ESC</button>
      <button class="btn" onclick="sendKey('\t')">TAB</button>
    </div>
    <!-- Row 2: Navigation Arrow Keys -->
    <div class="row">
      <button class="btn" onclick="sendKey('\x1b[A')">▲</button>
      <button class="btn" onclick="sendKey('\x1b[B')">▼</button>
      <button class="btn" onclick="sendKey('\x1b[D')">◀</button>
      <button class="btn" onclick="sendKey('\x1b[C')">▶</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();
    const term = new Terminal({
      cursorBlink: true,
      fontSize: 14,
      theme: { background: '#000000' }
    });
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);

    const termContainer = document.getElementById('terminal');
    term.open(termContainer);
    fitAddon.fit();

    // Auto Focus Mobile Keyboard
    function focusTerminal() {
      term.focus();
      const textarea = termContainer.querySelector('textarea');
      if (textarea) textarea.focus();
    }

    focusTerminal();
    termContainer.addEventListener('click', focusTerminal);
    termContainer.addEventListener('touchstart', focusTerminal);

    // Terminal Input & Output
    term.onData(data => socket.emit('input', data));
    socket.on('output', data => term.write(data));

    // Send Key Function
    function sendKey(key) {
      socket.emit('input', key);
      focusTerminal();
    }

    window.addEventListener('resize', () => fitAddon.fit());
  </script>
</body>
</html>
