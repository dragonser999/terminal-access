<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Web Terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      background-color: #0b0e14;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #terminal-container {
      flex: 1;
      width: 100%;
      height: calc(100vh - 44px);
      background: #0b0e14;
      padding: 5px;
    }
    .xterm {
      height: 100%;
    }
    /* Termius Style Single Row Scrollable Toolbar */
    #mobile-toolbar {
      height: 44px;
      background: #161b22;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      border-top: 1px solid #2d333b;
      padding: 0 8px;
      -webkit-overflow-scrolling: touch;
    }
    #mobile-toolbar::-webkit-scrollbar {
      display: none;
    }
    .btn {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      user-select: none;
      flex-shrink: 0;
    }
    .btn:active {
      background: #343942;
      color: #fff;
    }
  </style>
</head>
<body>

  <div id="terminal-container"></div>

  <!-- Mobile Extra Controls Bar -->
  <div id="mobile-toolbar">
    <button class="btn" onclick="sendKey('\x03')">Ctrl+C</button>
    <button class="btn" onclick="sendKey('\x0f')">Ctrl+O</button>
    <button class="btn" onclick="sendKey('\x18')">Ctrl+X</button>

    <button class="btn" onclick="sendKey('\x1b[A')">▲</button>
    <button class="btn" onclick="sendKey('\x1b[B')">▼</button>
    <button class="btn" onclick="sendKey('\x1b[D')">◀</button>
    <button class="btn" onclick="sendKey('\x1b[C')">▶</button>

    <button class="btn" onclick="sendKey('\x1b')">ESC</button>
    <button class="btn" onclick="sendKey('\t')">TAB</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();
    const term = new Terminal({
      cursorBlink: true,
      fontSize: 14,
      fontFamily: 'monospace',
      convertEol: true,
      theme: {
        background: '#0b0e14',
        foreground: '#c9d1d9'
      }
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);

    const container = document.getElementById('terminal-container');
    term.open(container);

    // Force Terminal Resize Function
    function resizeTerminal() {
      try {
        fitAddon.fit();
        if (term.rows && term.cols) {
          socket.emit('resize', { cols: term.cols, rows: term.rows });
        }
      } catch (e) {
        console.error(e);
      }
    }

    // Connect & Initial Setup
    socket.on('connect', () => {
      setTimeout(() => {
        resizeTerminal();
        term.focus();
      }, 200);
    });

    function focusTerminal() {
      term.focus();
      const textarea = container.querySelector('textarea');
      if (textarea) textarea.focus();
    }

    container.addEventListener('click', focusTerminal);
    container.addEventListener('touchstart', focusTerminal);

    term.onData(data => socket.emit('input', data));
    socket.on('output', data => term.write(data));

    function sendKey(key) {
      socket.emit('input', key);
      focusTerminal();
    }

    window.addEventListener('resize', resizeTerminal);
  </script>
</body>
</html>
